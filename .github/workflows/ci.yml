name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/login   # remove after merging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OpenEMR-Next.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # OpenEMR's first start is slow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'ci-root-password' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
          OE_PASS: ${{ secrets.OE_PASS || 'ci-admin-password' }}
          JWT_KEY: ${{ secrets.JWT_KEY || 'ci-only-jwt-key-change-me-0123456789abcdef' }}
          AUTHFACADE_CLIENT_SECRET: ${{ secrets.AUTHFACADE_CLIENT_SECRET || 'ci-client-secret' }}
        run: |
          cp .env.example .env
          {
            echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "OE_PASS=$OE_PASS"
            echo "JWT_KEY=$JWT_KEY"
            echo "AUTHFACADE_CLIENT_SECRET=$AUTHFACADE_CLIENT_SECRET"
          } >> .env

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 1200

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore