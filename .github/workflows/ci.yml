name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/login   # remove after merging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OpenEMR-Next.slnx
  SNAPSHOT_TAG: snapshot-openemr-8.0.0.3

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'ci-root-password' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
          OE_PASS: ${{ secrets.OE_PASS || 'ci-admin-password' }}
          JWT_KEY: ${{ secrets.JWT_KEY || 'ci-only-jwt-key-change-me-0123456789abcdef' }}
          AUTHFACADE_CLIENT_SECRET: ${{ secrets.AUTHFACADE_CLIENT_SECRET || 'ci-client-secret' }}
          AUTHFACADE_CLIENT_ID: ${{ vars.AUTHFACADE_CLIENT_ID || 'authfacade' }}
          OPENEMR_IMAGE: openemr/openemr:8.0.0.3
          MARIADB_IMAGE: mariadb:12.3.3
          PHPMYADMIN_IMAGE: phpmyadmin:5.2.3
        run: |
          cp .env.example .env
          {
            echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "OE_PASS=$OE_PASS"
            echo "JWT_KEY=$JWT_KEY"
            echo "AUTHFACADE_CLIENT_SECRET=$AUTHFACADE_CLIENT_SECRET"
            echo "AUTHFACADE_CLIENT_ID=$AUTHFACADE_CLIENT_ID"
            echo "OPENEMR_IMAGE=$OPENEMR_IMAGE"
            echo "MARIADB_IMAGE=$MARIADB_IMAGE"
            echo "PHPMYADMIN_IMAGE=$PHPMYADMIN_IMAGE"
          } >> .env

      - name: Download snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshots
          gh release download "$SNAPSHOT_TAG" --dir snapshots --pattern "db.sql" --pattern "sites.tar.gz" --pattern "images.txt"

      - name: Start database
        run: docker compose up -d mysql --wait

      - name: Restore database
        run: |
          docker compose cp snapshots/db.sql mysql:/tmp/db.sql
          docker compose exec -T mysql sh -c 'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" < /tmp/db.sql'
          # Recreate the app user, since the dump doesn't include it.
          docker compose exec -T mysql sh -c "mariadb -uroot -p\"\$MYSQL_ROOT_PASSWORD\" -e \"CREATE USER IF NOT EXISTS 'openemr'@'%' IDENTIFIED BY '\$DB_PASSWORD'; GRANT ALL PRIVILEGES ON openemr.* TO 'openemr'@'%'; FLUSH PRIVILEGES;\""

      - name: Restore OpenEMR sites
        run: |
          docker volume create openemr-next_sitesvolume
          docker run --rm \
            -v openemr-next_sitesvolume:/data \
            -v "$PWD/snapshots:/backup" \
            alpine sh -c "tar xzf /backup/sites.tar.gz -C /data"

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 1200

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore