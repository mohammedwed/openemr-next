name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OpenEMR-Next.slnx
  SNAPSHOT_TAG: snapshot-openemr-8.0.0.3-ci

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'ci-root-password' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
          OE_PASS: ${{ secrets.OE_PASS || 'ci-admin-password' }}
          JWT_KEY: ${{ secrets.JWT_KEY || 'ci-only-jwt-key-change-me-0123456789abcdef' }}
          AUTHFACADE_CLIENT_SECRET: ${{ secrets.AUTHFACADE_CLIENT_SECRET || 'ci-client-secret' }}
          AUTHFACADE_CLIENT_ID: ${{ vars.AUTHFACADE_CLIENT_ID || 'authfacade' }}
          OPENEMR_IMAGE: openemr/openemr:8.0.0.3
          MARIADB_IMAGE: mariadb:12.3.3
          PHPMYADMIN_IMAGE: phpmyadmin:5.2.3
        run: |
          printf '%s\n' \
            "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD" \
            "DB_PASSWORD=$DB_PASSWORD" \
            "OE_PASS=$OE_PASS" \
            "JWT_KEY=$JWT_KEY" \
            "AUTHFACADE_CLIENT_SECRET=$AUTHFACADE_CLIENT_SECRET" \
            "AUTHFACADE_CLIENT_ID=$AUTHFACADE_CLIENT_ID" \
            "OPENEMR_IMAGE=$OPENEMR_IMAGE" \
            "MARIADB_IMAGE=$MARIADB_IMAGE" \
            "PHPMYADMIN_IMAGE=$PHPMYADMIN_IMAGE" > .env
          # Print variable names only, never values.
          cut -d= -f1 .env

      - name: Download snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshots
          gh release download "$SNAPSHOT_TAG" --dir snapshots --pattern "db.sql" --pattern "sites.tar.gz" --pattern "images.txt"

      - name: Start database
        run: docker compose up -d mysql --wait

      - name: Restore database
        env:
          APP_PASS: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
        run: |
          docker compose cp snapshots/db.sql mysql:/tmp/db.sql
          docker compose exec -T mysql sh -c 'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" < /tmp/db.sql'
          printf '%s\n' \
            "CREATE USER IF NOT EXISTS 'openemr'@'%' IDENTIFIED BY '${APP_PASS}';" \
            "ALTER USER 'openemr'@'%' IDENTIFIED BY '${APP_PASS}';" \
            "GRANT ALL PRIVILEGES ON openemr.* TO 'openemr'@'%';" \
            "FLUSH PRIVILEGES;" > create-user.sql
          docker compose cp create-user.sql mysql:/tmp/create-user.sql
          docker compose exec -T mysql sh -c 'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" < /tmp/create-user.sql'

      - name: Restore OpenEMR sites
        run: |
          docker volume create openemr-next_sitesvolume
          docker run --rm \
            -v openemr-next_sitesvolume:/data \
            -v "$PWD/snapshots:/backup" \
            alpine sh -c "tar xzf /backup/sites.tar.gz -C /data"

      - name: Apply environment values to restored stack
        run: bash scripts/env-mngmnt/apply-env.sh

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 1200 openemr auth-facade phpmyadmin

      - name: Probe endpoints
        if: always()
        run: |
          for url in https://localhost:9300/meta/health/readyz http://localhost:7128/hello; do
            code=$(curl -k -s -o /dev/null --max-time 10 -w "%{http_code}" "$url" || true)
            echo "$url -> ${code:-no response}"
          done
          docker compose ps

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore