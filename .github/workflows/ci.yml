name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/login   # remove after merging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OpenEMR-Next.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mariadb:11.4   # must be a literal here; env.* isn't allowed in services
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'ci-root-password' }}
          MARIADB_DATABASE: openemr
          MARIADB_USER: openemr
          MARIADB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=openemr;Uid=openemr;Pwd=${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}"
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore