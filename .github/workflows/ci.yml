name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/login   # remove after merging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OpenEMR-Next.slnx
  SNAPSHOT_TAG: snapshot-openemr-8.0.0.3

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'ci-root-password' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
          OE_PASS: ${{ secrets.OE_PASS || 'ci-admin-password' }}
          JWT_KEY: ${{ secrets.JWT_KEY || 'ci-only-jwt-key-change-me-0123456789abcdef' }}
          AUTHFACADE_CLIENT_SECRET: ${{ secrets.AUTHFACADE_CLIENT_SECRET || 'ci-client-secret' }}
          AUTHFACADE_CLIENT_ID: ${{ vars.AUTHFACADE_CLIENT_ID || 'authfacade' }}
          OPENEMR_IMAGE: openemr/openemr:8.0.0.3
          MARIADB_IMAGE: mariadb:12.3.3
          PHPMYADMIN_IMAGE: phpmyadmin:5.2.3
        run: |
          printf '%s\n' \
            "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD" \
            "DB_PASSWORD=$DB_PASSWORD" \
            "OE_PASS=$OE_PASS" \
            "JWT_KEY=$JWT_KEY" \
            "AUTHFACADE_CLIENT_SECRET=$AUTHFACADE_CLIENT_SECRET" \
            "AUTHFACADE_CLIENT_ID=$AUTHFACADE_CLIENT_ID" \
            "OPENEMR_IMAGE=$OPENEMR_IMAGE" \
            "MARIADB_IMAGE=$MARIADB_IMAGE" \
            "PHPMYADMIN_IMAGE=$PHPMYADMIN_IMAGE" > .env
          # Print variable names only, never values.
          cut -d= -f1 .env

      - name: Download snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshots
          gh release download "$SNAPSHOT_TAG" --dir snapshots --pattern "db.sql" --pattern "sites.tar.gz" --pattern "images.txt"

      - name: Start database
        run: docker compose up -d mysql --wait

      - name: Restore database
        env:
          APP_PASS: ${{ secrets.DB_PASSWORD || 'ci-openemr-password' }}
        run: |
          docker compose cp snapshots/db.sql mysql:/tmp/db.sql
          docker compose exec -T mysql sh -c 'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" < /tmp/db.sql'
          printf '%s\n' \
            "CREATE USER IF NOT EXISTS 'openemr'@'%' IDENTIFIED BY '${APP_PASS}';" \
            "ALTER USER 'openemr'@'%' IDENTIFIED BY '${APP_PASS}';" \
            "GRANT ALL PRIVILEGES ON openemr.* TO 'openemr'@'%';" \
            "FLUSH PRIVILEGES;" > create-user.sql
          docker compose cp
          