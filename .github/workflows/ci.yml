name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore tests/Db.Tests/Db.Tests.csproj

      - name: Build
        run: dotnet build tests/Db.Tests/Db.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Db.Tests/Db.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/Db.Tests/TestResults/
          if-no-files-found: ignore
