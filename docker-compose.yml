name: openemr-next

services:
  # ---- Shared database ----
  mysql:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-8320}:3306"
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- OpenEMR (legacy) ----
  openemr:
    image: ${OPENEMR_IMAGE:?Set OPENEMR_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OPENEMR_HTTP_PORT:-8300}:80"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OPENEMR_HTTPS_PORT:-9300}:443"
    volumes:
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USER:-openemr}
      MYSQL_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OE_USER: ${OPENEMR_ADMIN_USER:-admin}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD:?Set OPENEMR_ADMIN_PASSWORD in .env}
      OPENEMR_SETTING_site_addr_oath: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}"
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_system_scopes_api: 1

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-8310}:80"
    environment:
      PMA_HOSTS: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # ---- One-shot: registers the AuthFacade OAuth client ----
  # Runs the OpenEMR image itself, not a bare MariaDB client: it needs OpenEMR's own CryptoGen to encrypt
  # the client secret the way OpenEMR's own ClientRepository does, which needs the real site keys in
  # sitesvolume (ADR 0025). A plaintext secret silently breaks the authorization_code grant's client
  # authentication (ADR 0014), even though the password and refresh grants never check it at all.
  seed:
    image: ${OPENEMR_IMAGE:?Set OPENEMR_IMAGE in .env}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-openemr}
      DB_USER: ${DB_USER:-openemr}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AUTHFACADE_CLIENT_ID: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      AUTHFACADE_CLIENT_SECRET: ${AUTHFACADE_CLIENT_SECRET:-}
      AUTHFACADE_REDIRECT_URI: http://localhost:${AUTHFACADE_HTTP_PORT:-7128}/callback
    volumes:
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites
      - ./scripts/seeds/authfacade-client.php:/seed/authfacade-client.php:ro
    entrypoint: ["php", "/seed/authfacade-client.php"]

  # ---- AuthFacade (.NET) ----
  auth-facade:
    build:
      context: src/Services/AuthFacade
      dockerfile: Dockerfile
    restart: unless-stopped
    # Needs OpenEMR (not the database) at request time. It does not need OpenEMR to be healthy to
    # start: /health is static and calls to OpenEMR go through circuit breakers.
    depends_on:
      openemr:
        condition: service_started
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AUTHFACADE_HTTP_PORT:-7128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${AUTHFACADE_ENVIRONMENT:-Production}
      OpenEmr__BaseUrl: "http://openemr:80"
      OpenEmr__Issuer: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}/oauth2/default"
      OpenEmr__ClientId: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      OpenEmr__ClientSecret: ${AUTHFACADE_CLIENT_SECRET:?Set AUTHFACADE_CLIENT_SECRET in .env}
      OpenEmr__Scope: openid profile email offline_access
      # Must match the redirect_uri the seed registers for this client (ADR 0005, ADR 0024). Computed the
      # same way the seed service computes AUTHFACADE_REDIRECT_URI above: Compose does not share one
      # service's environment values with another.
      OpenEmr__RedirectUri: "http://localhost:${AUTHFACADE_HTTP_PORT:-7128}/callback"
      # Where the browser flow (ADR 0024) lands with no returnUrl, or one outside the allow-list: the Login UI.
      BrowserFlow__DefaultReturnUrl: "http://localhost:${LOGINUI_HTTP_PORT:-7129}/"
      BrowserFlow__ReturnUrlAllowedHosts__0: localhost

  # ---- Login UI (Blazor) ----
  # A static page: one "Log in with OpenEMR" link to AuthFacade's /oidc/login (ADR 0026). It holds no
  # credentials and calls AuthFacade for nothing itself; the browser follows the link directly.
  login-ui:
    build:
      context: src/Services/LoginUi
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${LOGINUI_HTTP_PORT:-7129}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${LOGINUI_ENVIRONMENT:-Production}
      # The browser follows this link directly, so it must be the host-reachable AuthFacade address
      # (AUTHFACADE_HTTP_PORT), not the Compose-internal "auth-facade" hostname.
      AuthFacade__BaseUrl: "http://localhost:${AUTHFACADE_HTTP_PORT:-7128}"

volumes:
  databasevolume: {}
  sitesvolume: {}