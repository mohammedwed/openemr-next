name: openemr-next

# A fixed subnet, not Compose's own dynamically-assigned default, so AuthFacade can trust forwarded
# headers (X-Forwarded-For/-Proto) from exactly this network and nothing else (ADR 0039). Every service
# below still joins this implicitly; naming "default" here only pins its subnet.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_CIDR:-172.28.0.0/16}

services:
  # ---- Shared database ----
  mysql:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-8320}:3306"
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- OpenEMR (legacy) ----
  openemr:
    image: ${OPENEMR_IMAGE:?Set OPENEMR_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OPENEMR_HTTP_PORT:-8300}:80"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OPENEMR_HTTPS_PORT:-9300}:443"
    volumes:
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USER:-openemr}
      MYSQL_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OE_USER: ${OPENEMR_ADMIN_USER:-admin}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD:?Set OPENEMR_ADMIN_PASSWORD in .env}
      OPENEMR_SETTING_site_addr_oath: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}"
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_system_scopes_api: 1
    healthcheck:
      # OpenEMR itself, not the TCP port: the site can accept a connection well before its own
      # install/upgrade routine finishes and it actually serves requests. A generous start_period: a
      # fresh install takes noticeably longer than a warm restart, and failures during it never count
      # against retries, so this only costs time, not a false "unhealthy" on a slow first boot.
      test: ["CMD", "curl", "-f", "http://localhost/meta/health/readyz"]
      start_period: 3m
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-8310}:80"
    environment:
      PMA_HOSTS: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # ---- One-shot: registers the AuthFacade OAuth client ----
  # Runs the OpenEMR image itself, not a bare MariaDB client: it needs OpenEMR's own CryptoGen to encrypt
  # the client secret the way OpenEMR's own ClientRepository does, which needs the real site keys in
  # sitesvolume (ADR 0025). A plaintext secret silently breaks the authorization_code grant's client
  # authentication (ADR 0014), even though the password and refresh grants never check it at all.
  seed:
    image: ${OPENEMR_IMAGE:?Set OPENEMR_IMAGE in .env}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-openemr}
      DB_USER: ${DB_USER:-openemr}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AUTHFACADE_CLIENT_ID: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      AUTHFACADE_CLIENT_SECRET: ${AUTHFACADE_CLIENT_SECRET:-}
      # The gateway's HTTPS address (ADR 0033, ADR 0039), not AuthFacade's own: OpenEMR redirects the
      # browser here after login, and that redirect's response is what sets the AuthFacadeSession cookie.
      # For the dashboard's own later fetch calls (also made through the gateway) to carry that cookie, the
      # whole round trip has to land on the one origin the dashboard is itself served from. HTTPS, not the
      # gateway's plain-HTTP port, which now only redirects (ADR 0039) -- registering the plain-HTTP
      # address here would just add an extra http-then-https hop to every login.
      AUTHFACADE_REDIRECT_URI: https://localhost:${GATEWAY_HTTPS_PORT:-7131}/callback
      # Where OpenEMR sends the browser back after RP-initiated logout (ADR 0040) -- must exactly match
      # what AuthFacade's own /logout sends as post_logout_redirect_uri, byte for byte: OpenEMR compares
      # this column with a plain SQL `=`, not a host allow-list. Same value AuthFacade's own
      # BrowserFlow:DefaultReturnUrl already resolves to; Compose does not share one service's environment
      # values with another, so it is computed the same way a second time, same as AUTHFACADE_REDIRECT_URI.
      AUTHFACADE_POST_LOGOUT_REDIRECT_URI: http://localhost:${LOGINUI_HTTP_PORT:-7129}/
    volumes:
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites
      - ./scripts/seeds/authfacade-client.php:/seed/authfacade-client.php:ro
    entrypoint: ["php", "/seed/authfacade-client.php"]

  # ---- One-shot: creates AuthFacade's own dedicated database and user ----
  # Runs the bare MariaDB image already used for the mysql service itself (ADR 0043): AuthFacade's
  # session-related state (OpenIddict.Client's state-token store and the Data Protection key ring behind
  # the AuthFacadeSession cookie) lives here, in a database separate from OpenEMR's own, surviving a
  # container restart instead of being lost with it.
  seed-authfacade-db:
    image: ${MARIADB_IMAGE}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      AUTHFACADE_DB_NAME: ${AUTHFACADE_DB_NAME:-authfacade}
      AUTHFACADE_DB_USER: ${AUTHFACADE_DB_USER:-authfacade}
      AUTHFACADE_DB_PASSWORD: ${AUTHFACADE_DB_PASSWORD:?Set AUTHFACADE_DB_PASSWORD in .env}
    volumes:
      - ./scripts/seeds/authfacade-db.sh:/seed/authfacade-db.sh:ro
    entrypoint: ["bash", "/seed/authfacade-db.sh"]

  # ---- AuthFacade (.NET) ----
  auth-facade:
    build:
      context: src/Services/AuthFacade
      dockerfile: Dockerfile
    restart: unless-stopped
    # Waits for OpenEMR's own readiness probe, not just its container starting, so the window where a
    # request would hit a still-booting OpenEMR and fail with a raw connection error is closed before
    # this container even starts (ADR 0036). AuthFacade's own startup also polls the same probe, as a
    # second line of defense outside Compose (a bare `dotnet run`, or a race).
    #
    # Also depends on `seed` completing, so a `docker compose up` that brings up auth-facade (named
    # explicitly or as part of the whole stack) always pulls `seed` in as a dependency too (ADR 0037).
    # Compose recreates and reruns a one-shot service when its own resolved config changes, but only if
    # something actually asks for it that run; without this, changing AUTHFACADE_CLIENT_ID/_SECRET/
    # _REDIRECT_URI (or the formula that builds the seed's redirect URI, as ADR 0033 did) left the stale
    # registration in place until someone remembered to `docker compose up seed` by hand, and OpenEMR
    # answered every login with `invalid_client`.
    depends_on:
      openemr:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      seed-authfacade-db:
        condition: service_completed_successfully
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AUTHFACADE_HTTP_PORT:-7128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${AUTHFACADE_ENVIRONMENT:-Production}
      OpenEmr__BaseUrl: "http://openemr:80"
      OpenEmr__Issuer: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}/oauth2/default"
      OpenEmr__ClientId: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      OpenEmr__ClientSecret: ${AUTHFACADE_CLIENT_SECRET:?Set AUTHFACADE_CLIENT_SECRET in .env}
      # Must match the redirect_uri the seed registers for this client (ADR 0005, ADR 0024), and the
      # gateway's HTTPS address, not AuthFacade's own (ADR 0033, ADR 0039) -- see AUTHFACADE_REDIRECT_URI
      # above. Computed the same way the seed service computes it: Compose does not share one service's
      # environment values with another.
      OpenEmr__RedirectUri: "https://localhost:${GATEWAY_HTTPS_PORT:-7131}/callback"
      # Where the browser flow (ADR 0024) lands with no returnUrl, or one outside the allow-list: the Login UI.
      BrowserFlow__DefaultReturnUrl: "http://localhost:${LOGINUI_HTTP_PORT:-7129}/"
      BrowserFlow__ReturnUrlAllowedHosts__0: localhost
      # The one network the gateway's forwarded X-Forwarded-For/-Proto headers (ADR 0039) are trusted
      # from, so a request reaching AuthFacade directly on its own published port cannot spoof either one.
      ForwardedHeaders__TrustedNetworkCidr: ${DOCKER_NETWORK_CIDR:-172.28.0.0/16}
      # AuthFacade's own dedicated database (ADR 0043), created by seed-authfacade-db above -- separate
      # from OpenEMR's own "openemr" database, on the same mysql service.
      AuthFacadeDb__Host: mysql
      AuthFacadeDb__Database: ${AUTHFACADE_DB_NAME:-authfacade}
      AuthFacadeDb__User: ${AUTHFACADE_DB_USER:-authfacade}
      AuthFacadeDb__Password: ${AUTHFACADE_DB_PASSWORD:?Set AUTHFACADE_DB_PASSWORD in .env}

  # ---- WebApp (Blazor WebAssembly dashboard) ----
  # Static files only, served by nginx (ADR 0033). Not published on the host: it only works correctly
  # reached through the gateway, which is the one origin its AuthFacadeSession cookie is actually scoped
  # to once a login completes. Publishing its own port directly would let someone load it from the wrong
  # origin and find the session cookie never attaches.
  webapp:
    build:
      # Context is the repository root, not this directory: the app references
      # OpenEmrNext.AuthFacade.Client (ADR 0031), under src/Services/AuthFacade/, which a context scoped to
      # src/Services/WebApp could not reach.
      context: .
      dockerfile: src/Services/WebApp/Dockerfile
    restart: unless-stopped

  # ---- Gateway (YARP) ----
  # The single external origin a browser talks to for the dashboard (ADR 0033): routes AuthFacade's own
  # path prefixes to it and everything else to WebApp's static files. Makes no auth decisions of its own.
  # Terminates TLS with the self-signed dev cert from scripts/setup/new-dev-cert.sh (ADR 0039): the plain
  # HTTP port stays open only to redirect to HTTPS, never to serve a response itself.
  gateway:
    build:
      context: src/Services/Gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-facade
      - webapp
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HTTP_PORT:-7130}:8080"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-7131}:8443"
    volumes:
      - ./certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      Kestrel__Certificates__Default__Path: /certs/gateway.crt
      Kestrel__Certificates__Default__KeyPath: /certs/gateway.key
      # The externally-visible HTTPS port, for the redirect's Location header -- the internal Kestrel
      # port (8443) is never what the browser actually reaches (the same internal/external split ADR
      # 0012, ADR 0026 and ADR 0034 each already hit once for a different address).
      HttpsRedirection__HttpsPort: ${GATEWAY_HTTPS_PORT:-7131}
      AuthFacade__BaseUrl: "http://auth-facade:8080"
      WebApp__BaseUrl: "http://webapp:8080"

  # ---- Login UI (Blazor) ----
  # A static page: one "Log in with OpenEMR" link to AuthFacade's /oidc/login (ADR 0026). It holds no
  # credentials and calls AuthFacade for nothing itself; the browser follows the link directly.
  login-ui:
    build:
      context: src/Services/LoginUi
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${LOGINUI_HTTP_PORT:-7129}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${LOGINUI_ENVIRONMENT:-Production}
      # The browser follows this link directly, so it must be a host-reachable address, not the
      # Compose-internal "auth-facade" hostname. The gateway's HTTPS address (ADR 0039), not AuthFacade's
      # own plain-HTTP port: /oidc/login is exactly the request the Secure session cookie depends on
      # reaching AuthFacade as HTTPS, and the gateway's route table already proxies it (ADR 0033).
      AuthFacade__BaseUrl: "https://localhost:${GATEWAY_HTTPS_PORT:-7131}"

volumes:
  databasevolume: {}
  sitesvolume: {}