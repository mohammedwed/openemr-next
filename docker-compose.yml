name: openemr-next

services:
  # ---- Shared database ----
  mysql:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    ports:
      - "${DB_PORT:-8320}:3306"
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- OpenEMR (legacy) ----
  openemr:
    image: ${OPENEMR_IMAGE:?Set OPENEMR_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${OPENEMR_HTTP_PORT:-8300}:80"
      - "${OPENEMR_HTTPS_PORT:-9300}:443"
    volumes:
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USER:-openemr}
      MYSQL_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OE_USER: ${OPENEMR_ADMIN_USER:-admin}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD:?Set OPENEMR_ADMIN_PASSWORD in .env}
      OPENEMR_SETTING_site_addr_oath: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}"
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_system_scopes_api: 1

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8310}:80"
    environment:
      PMA_HOSTS: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # ---- One-shot: registers the AuthFacade OAuth client ----
  seed:
    image: ${MARIADB_IMAGE}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-openemr}
      DB_USER: ${DB_USER:-openemr}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AUTHFACADE_CLIENT_ID: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      AUTHFACADE_CLIENT_SECRET: ${AUTHFACADE_CLIENT_SECRET:-}
      AUTHFACADE_REDIRECT_URI: http://localhost:${AUTHFACADE_HTTP_PORT:-7128}/callback
    volumes:
      - ./scripts/seeds/authfacade-client.sql:/seed/authfacade-client.sql:ro
      - ./scripts/seeds/authfacade-client.sh:/seed/seed.sh:ro
      
    entrypoint: ["sh", "/seed/seed.sh"]

  # ---- AuthFacade (.NET) ----
  auth-facade:
    build:
      context: src/Services/AuthFacade
      dockerfile: Dockerfile
    restart: unless-stopped
    # Needs OpenEMR (not the database) at request time. It does not need OpenEMR to be healthy to
    # start: /api/health is static and calls to OpenEMR go through circuit breakers.
    depends_on:
      openemr:
        condition: service_started
    ports:
      - "${AUTHFACADE_HTTP_PORT:-7128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OpenEmr__BaseUrl: "http://openemr:80"
      OpenEmr__Issuer: "https://localhost:${OPENEMR_HTTPS_PORT:-9300}/oauth2/default"
      OpenEmr__ClientId: ${AUTHFACADE_CLIENT_ID:?Set AUTHFACADE_CLIENT_ID in .env}
      OpenEmr__ClientSecret: ${AUTHFACADE_CLIENT_SECRET:?Set AUTHFACADE_CLIENT_SECRET in .env}
      OpenEmr__Scope: openid profile email offline_access

volumes:
  databasevolume: {}
  sitesvolume: {}