services:
  auth-facade:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FACADE_HTTP_PORT:-7128}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Port=${OPENEMR_DB_PORT:-8320};Database=openemr;Uid=${OPENEMR_DB_USER:-openemr};Pwd=${OPENEMR_DB_PASSWORD:?Set OPENEMR_DB_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      OpenEmr__BaseUrl: https://host.docker.internal:9300
      OpenEmr__ClientId: ${OPENEMR_CLIENT_ID:?Set OPENEMR_CLIENT_ID in .env}
      OpenEmr__ClientSecret: ${OPENEMR_CLIENT_SECRET:?Set OPENEMR_CLIENT_SECRET in .env}
      OpenEmr__Scope: openid api:oemr
    extra_hosts:
      - "host.docker.internal:host-gateway"