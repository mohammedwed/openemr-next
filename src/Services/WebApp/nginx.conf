server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the Blazor WebAssembly router owns client-side: serve the real file (CSS, JS, the
    # fingerprinted _framework/* assets) if it exists, otherwise fall back to index.html so the app's own
    # router can resolve a deep link or a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .wasm needs this MIME type for WebAssembly.instantiateStreaming to take the fast path; nginx's
    # default mime.types does not include it. Scoped to this one extension via default_type, not a
    # top-level `types {}` block: that directive REPLACES the whole inherited MIME table rather than
    # adding to it, which is what silently turned every other file's Content-Type into
    # application/octet-stream -- including index.html, which is why a browser offered it as a download
    # instead of rendering it.
    location ~ \.wasm$ {
        default_type application/wasm;
    }
}
